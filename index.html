<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEON DRIFT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff2bd6' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2328f0ff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#160024">
<style>
  :root { --neon: #ff2bd6; --cyan: #28f0ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: "Courier New", monospace; }
  #gl { display: block; width: 100vw; height: 100vh; }

  /* DOM overlays for crisp text */
  #overlay-text { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  #title {
    position: absolute; top: 38%; left: 0; width: 100%; text-align: center;
    font-weight: bold; font-size: clamp(2.5rem, 11vw, 9rem); letter-spacing: 0.15em;
    color: #fff; opacity: 0; transition: opacity .1s linear;
    text-shadow: 0 0 12px var(--cyan), 0 0 28px var(--neon), 0 0 60px var(--neon);
    font-family: Arial, Helvetica, sans-serif; transform: translateZ(0);
  }
  #subtitle {
    position: absolute; top: 56%; left: 0; width: 100%; text-align: center;
    font-size: clamp(.8rem, 2.5vw, 1.4rem); letter-spacing: 0.5em; color: var(--cyan);
    opacity: 0; transition: opacity .1s linear; text-shadow: 0 0 10px var(--cyan);
  }

  /* scroller */
  #scroller-wrap {
    position: absolute; bottom: 8%; left: 0; width: 100%; height: 3rem;
    overflow: hidden; opacity: 0; transition: opacity .3s linear;
  }
  #scroller {
    position: absolute; white-space: nowrap; font-size: clamp(1.2rem, 3.5vw, 2.2rem);
    font-weight: bold; color: #fff; letter-spacing: .1em; will-change: transform;
    text-shadow: 0 0 10px var(--neon), 0 0 22px var(--neon);
    font-family: Arial, Helvetica, sans-serif;
  }

  /* start overlay */
  #start {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.4rem; cursor: pointer;
    background: radial-gradient(ellipse at center, #160024 0%, #000 75%);
    color: #fff; text-align: center; transition: opacity .6s ease;
  }
  #start h1 {
    font-family: Arial, Helvetica, sans-serif; font-size: clamp(2rem, 9vw, 6rem);
    letter-spacing: .2em; text-shadow: 0 0 14px var(--cyan), 0 0 40px var(--neon);
  }
  #start .hint {
    font-size: 1rem; letter-spacing: .3em; color: var(--cyan); text-transform: uppercase;
    animation: pulse 1.4s ease-in-out infinite;
  }
  #start .sub { font-size: .85rem; color: #888; letter-spacing: .15em; max-width: 30rem; }
  @keyframes pulse { 0%,100% { opacity:.4 } 50% { opacity:1 } }

  /* drag&drop feedback */
  #drop { position: fixed; inset: 0; z-index: 20; display: none; align-items: center;
    justify-content: center; background: rgba(255,43,214,.18); border: 4px dashed var(--cyan);
    color: #fff; font-size: 1.6rem; letter-spacing: .2em; }
  body.dragging #drop { display: flex; }

  #now-playing { position: fixed; top: 12px; right: 16px; z-index: 6; color: var(--cyan);
    font-size: .75rem; letter-spacing: .15em; opacity: 0; transition: opacity .4s;
    text-shadow: 0 0 8px var(--cyan); }
</style>
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="overlay-text">
    <div id="title">NEON DRIFT</div>
    <div id="subtitle">A WEBGL DEMO</div>
    <div id="scroller-wrap"><div id="scroller"></div></div>
  </div>

  <div id="now-playing"></div>

  <div id="start">
    <h1>NEON DRIFT</h1>
    <div class="hint">▶ Click to start</div>
    <div class="sub">Kopfhörer auf. Ziehe jederzeit ein WAV/MP3 ins Fenster, um deinen eigenen Track laufen zu lassen.</div>
  </div>

  <div id="drop">DROP TRACK TO PLAY</div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
